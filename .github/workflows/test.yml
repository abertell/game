name: test2

on:
  push:
    branches:
      - "master"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
      with:
        persist-credentials: false
    - uses: actions/setup-node@v1
      with:
        node-version: "20"
        registry-url: 'https://npm.pkg.github.com/'
    - name: build
      run: |
        yarn install
        yarn tsc
        yarn build:data
        yarn build:swf
        yarn build
    - uses: JamesIves/github-pages-deploy-action@3.6.2
      with:
        ACCESS_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        REPOSITORY_NAME: exit-path-tas/exit-path-tas.github.io
        BRANCH: gh-pages
        FOLDER: dist
